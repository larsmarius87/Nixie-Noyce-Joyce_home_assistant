name: Publish version releases

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/noyce_joyce_nixie/manifest.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch preserved version branches
        shell: bash
        run: |
          git fetch --prune origin '+refs/heads/v*:refs/remotes/origin/v*'

      - name: Publish preserved versions and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          versions=(
            v0.1.0
            v0.2.0
            v0.3.0
            v0.4.0
            v0.5.0
            v0.6.0
            v0.6.5
            v0.6.6
            v0.6.7
            v0.6.8
            v0.6.9
            v0.6.10
            v0.6.11
            v0.6.12
            v0.6.13
            v0.6.14
          )

          mkdir -p "$GITHUB_WORKSPACE/dist"

          for tag in "${versions[@]}"; do
            ref="origin/$tag"
            sha="$(git rev-parse "$ref")"

            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" \
                --target "$sha" \
                --title "Noyce Joyce Nixie $tag" \
                --notes "Arkivert utgave av Noyce Joyce Nixie Home Assistant-integrasjonen. Se vedlagt CHANGELOG.md for full versjonshistorikk."
            fi

            worktree="$RUNNER_TEMP/nixie-$tag"
            rm -rf "$worktree"
            git worktree add --detach "$worktree" "$ref" >/dev/null

            asset="$GITHUB_WORKSPACE/dist/noyce_joyce_nixie_ha_$tag.zip"
            rm -f "$asset"

            (
              cd "$worktree"
              zip -qr "$asset" custom_components/noyce_joyce_nixie

              for file in README.md PROTOCOL.md CHANGELOG.md hacs.json; do
                if [ -f "$file" ]; then
                  zip -q -u "$asset" "$file"
                fi
              done
            )

            git worktree remove --force "$worktree"

            gh release upload "$tag" \
              "$asset" \
              "$GITHUB_WORKSPACE/CHANGELOG.md" \
              --clobber
          done

          # Ensure the newest preserved release remains GitHub's Latest release
          # even though older releases may have been backfilled in this run.
          gh release edit v0.6.14 --latest
