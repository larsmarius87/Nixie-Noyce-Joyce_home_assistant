name: Publish version releases

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/noyce_joyce_nixie/manifest.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch preserved version branches
        shell: bash
        run: |
          git fetch --prune origin '+refs/heads/v*:refs/remotes/origin/v*'

      - name: Publish preserved versions and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(python -c 'import json; print(json.load(open("custom_components/noyce_joyce_nixie/manifest.json"))["version"])')"
          current_tag="v$current_version"

          mapfile -t versions < <(
            git for-each-ref --format='%(refname:short)' refs/remotes/origin/v*               | sed 's#^origin/##'               | sort -V
          )

          if ! printf '%s
' "${versions[@]}" | grep -Fxq "$current_tag"; then
            versions+=("$current_tag")
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"

          for tag in "${versions[@]}"; do
            if [ "$tag" = "$current_tag" ]; then
              ref="$GITHUB_SHA"
            else
              ref="origin/$tag"
            fi
            sha="$(git rev-parse "$ref")"

            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag"                 --target "$sha"                 --title "Noyce Joyce Nixie $tag"                 --notes "Arkivert utgave av Noyce Joyce Nixie Home Assistant-integrasjonen. Se vedlagt CHANGELOG.md for versjonshistorikk."
            fi

            worktree="$RUNNER_TEMP/nixie-$tag"
            rm -rf "$worktree"
            git worktree add --detach "$worktree" "$ref" >/dev/null

            asset="$GITHUB_WORKSPACE/dist/noyce_joyce_nixie_ha_$tag.zip"
            changelog_asset="$GITHUB_WORKSPACE/dist/CHANGELOG-$tag.md"
            rm -f "$asset" "$changelog_asset"

            (
              cd "$worktree"
              zip -qr "$asset" custom_components/noyce_joyce_nixie

              for file in README.md PROTOCOL.md CHANGELOG.md hacs.json; do
                if [ -f "$file" ]; then
                  zip -q -u "$asset" "$file"
                fi
              done

              if [ -f CHANGELOG.md ]; then
                cp CHANGELOG.md "$changelog_asset"
              else
                cp "$GITHUB_WORKSPACE/CHANGELOG.md" "$changelog_asset"
              fi
            )

            git worktree remove --force "$worktree"

            gh release upload "$tag"               "$asset"               "$changelog_asset#CHANGELOG.md"               --clobber
          done

          gh release edit "$current_tag" --latest
